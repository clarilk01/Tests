# Gel Performance Tool - configuration (GO / NO-GO decision tree)
#
# ALL VALUES BELOW ARE ILLUSTRATIVE, chosen for the synthetic dataset in data/synthetic/.
# They are not real process limits. With real data each value would be agreed with
# process experts and changed only through a reviewed, versioned update.

config_version: "1.0.0"   # bump on ANY change; written into every output row for traceability
# History:
#   0.x    weighted 0-100 health score with OK / WATCH / REPLACE SOON (replaced)
#   1.0.0  decision-tree replacement score 0-1 with a GO / NO-GO decision

# Global settings
defaults:
  rolling_window: 10          # rolling mean of each KPI over the last N cycles of the same gel batch
  z_clip: 6.0                 # cap |z| at this value so a single extreme value cannot dominate
  decision_threshold: 0.5     # replacement score >= this counts as "high"

# The decision tree. Trained by: python -m gel_performance.train
model:
  file: models/gonogo_tree.json
  max_depth: 3                # shallow on purpose: every rule can be printed and read
  min_samples_leaf: 20        # each final rule must be backed by at least 20 training cycles
  replace_horizon: 25         # training label: "replace" if the true replacement point is <= 25 cycles away

# One section per chromatography type: its own early-life baseline and its own pressure limit,
# because each column set-up runs at a different pressure and flow.
chromatography_types:

  type_A:
    reference:
      first_n_cycles: 30      # early-life window: cycles 1..N of every gel batch form the baseline
      method: mean_std        # mean_std (classic z-score) or robust (median / MAD)
      scope: pooled           # pooled (one baseline per type) or per_batch (each batch vs its own start)
    kpis:
      # direction orients the z-score so that a higher value always means "worse"
      elution_flow_median: { direction: lower_is_worse }
      pt_80_percentile:    { direction: higher_is_worse }   # the elution pressure KPI
    resin_age_scale_cycles: 100   # z of gel age = (age - mean age in reference window) / 100
    pressure_limit_bar: 1.36      # synthetic: ~12% above fresh type_A resin (1.21 bar)

  type_B:
    reference:
      first_n_cycles: 30
      method: mean_std
      scope: pooled
    kpis:
      elution_flow_median: { direction: lower_is_worse }
      pt_80_percentile:    { direction: higher_is_worse }
    resin_age_scale_cycles: 100
    pressure_limit_bar: 3.02      # synthetic: ~12% above fresh type_B resin (2.70 bar)
